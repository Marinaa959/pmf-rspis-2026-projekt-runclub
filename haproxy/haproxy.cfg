global
    daemon
    maxconn 256

defaults
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend http-in
    bind *:8080
    acl is_routes path_beg /routes
    use_backend route-service if is_routes
    default_backend club-service

frontend stats
    mode http
    bind *:8404
    stats enable
    stats refresh 5s
    stats uri /stats
    stats show-modules

backend club-service
    option httpchk
    http-check send meth GET uri /actuator/health
    server club-service-1 club-service:8080 check inter 2s fall 2 port 8081

backend route-service
    option httpchk
    http-check send meth GET uri /actuator/health
    server route-service-1 route-service:8082 check inter 2s fall 2 port 8083
