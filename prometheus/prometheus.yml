global:
  scrape_interval: 5s

scrape_configs:
  - job_name: club-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['club-service:8081']
        labels:
          service: club-service

  - job_name: route-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['route-service:8083']
        labels:
          service: route-service
