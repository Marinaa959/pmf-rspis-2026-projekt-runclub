spring:
  datasource:
    url: jdbc:h2:mem:runclub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop      # svježa shema za svaki test run
    show-sql: false
  ai:
    openai:
      api-key: test-key          # testovi ne zovu model
      base-url: http://localhost

club-service:
  route-service:
    base-url: http://localhost:9999   # unit testovi mockiraju RouteClient
    timeout-in-seconds: 1
